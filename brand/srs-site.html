<title>Solare Source</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">

<style>
:root{ --ink:#1E1F2B; --surface:#EFEFEF; --bar:10px; --barh:72px; }
*{box-sizing:border-box}
body{margin:0; background:var(--ink); color:var(--surface);
  font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased}
a{color:inherit; text-decoration:none}
svg{display:block}

/* ---------------- translucent bar ---------------- */
.topbar{
  position:fixed; top:var(--bar); left:var(--bar); right:var(--bar); z-index:50;
  height:var(--barh); display:flex; align-items:center; gap:16px;
  padding-inline:16px;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(14px) saturate(1.2);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid rgba(255,255,255,.22);
  color:#fff;
}
.brand{display:flex; align-items:center; gap:7px; margin-right:auto}
.brand svg{width:23px; height:23px; flex:none}
.brand b{font-size:24px; font-weight:500; letter-spacing:-.015em; line-height:1}

/* white primary button, square corners */
.cta{
  display:grid; place-items:center; min-width:210px; height:40px; padding-inline:24px;
  background:#fff; color:#000; font-size:16px; font-weight:500; letter-spacing:-.01em;
  border:1px solid #fff; transition:background .18s, color .18s;
}
.cta:hover{background:transparent; color:#fff}

/* two icon cells sharing one border */
.icons{display:flex; border:1px solid #fff; height:40px}
.icons button{
  width:40px; height:100%; display:grid; place-items:center;
  background:transparent; border:0; color:#fff; cursor:pointer;
  transition:background .18s, color .18s;
}
.icons button+button{border-left:1px solid #fff}
.icons button:hover{background:#fff; color:#000}
.icons svg{width:19px; height:19px}

@media (max-width:640px){
  .cta{min-width:0; padding-inline:16px; font-size:15px}
  .brand b{font-size:20px}
}

/* ---------------- hero placeholder ---------------- */
.hero{position:relative; min-height:100svh; display:grid; align-content:end;
  padding:0 clamp(1.5rem,4vw,4rem) clamp(3rem,7vw,6rem)}
.hero .sky{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  filter:grayscale(1) contrast(1.15) brightness(.62); z-index:-1}
.hero h1{margin:0; font-size:clamp(2.6rem,7vw,6rem); font-weight:600;
  letter-spacing:-.04em; line-height:.95; max-width:16ch}
</style>

<nav class="topbar">
  <a class="brand" href="#top" aria-label="Solare Source home">
    <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4.5" aria-hidden="true">
      <circle cx="20" cy="20" r="15.25"/>
      <path d="M11 17 20 24 29 17" stroke-linejoin="miter"/>
    </svg>
    <b>Solare Source</b>
  </a>

  <a class="cta" href="#book">Get Started</a>

  <div class="icons">
    <button type="button" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="11" cy="10" r="6.2"/><path d="M7.2 14.6 3.4 20.6"/>
      </svg>
    </button>
    <button type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M3 6.5h18M3 12h18M3 17.5h18"/>
      </svg>
    </button>
  </div>
</nav>

<!-- hero: placeholder sky so the translucency is visible. Swap for the real photo/video. -->
<section class="hero" id="top">
  <svg class="sky" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <filter id="clouds"><feTurbulence type="fractalNoise" baseFrequency=".004 .009" numOctaves="5" seed="7"/>
      <feColorMatrix values="0 0 0 0 .82  0 0 0 0 .84  0 0 0 0 .88  1 0 0 0 -.1"/></filter>
    <rect width="1200" height="800" fill="#5a6270"/>
    <rect width="1200" height="800" filter="url(#clouds)"/>
  </svg>
  <h1>Solar panels, recovered whole.</h1>
</section>
